[workspace]
resolver = "3"
members = [
  "rust/phon",
  "rust/phon-codegen",
  "rust/phon-conformance",
  "rust/phon-engine",
  "rust/phon-ir",
  "rust/phon-jit",
  "rust/phon-storage",
  "rust/phon-schema",
]

[workspace.package]
version = "0.2.0-rc.5"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/phon"
homepage = "https://github.com/bearcove/phon"

[workspace.dependencies]
blake3 = { version = "1", default-features = false }
copypatch = { git = "https://github.com/bearcove/weavy", rev = "ca49bde0aa8e105da661edf6dd09f7013fe86aaf" }
facet = { git = "https://github.com/facet-rs/facet", rev = "84c07e6defd0c2fc46d7772e2aaa191143edd813" }
facet-json = { git = "https://github.com/facet-rs/facet", rev = "84c07e6defd0c2fc46d7772e2aaa191143edd813" }
facet-value = { git = "https://github.com/facet-rs/facet", rev = "84c07e6defd0c2fc46d7772e2aaa191143edd813" }
phon = { path = "rust/phon", version = "0.2.0-rc.5" }
phon-codegen = { path = "rust/phon-codegen", version = "0.2.0-rc.5" }
phon-conformance = { path = "rust/phon-conformance", version = "0.2.0-rc.5" }
phon-engine = { path = "rust/phon-engine", version = "0.2.0-rc.5" }
phon-ir = { path = "rust/phon-ir", version = "0.2.0-rc.5" }
phon-jit = { path = "rust/phon-jit", version = "0.2.0-rc.5" }
phon-storage = { path = "rust/phon-storage", version = "0.2.0-rc.5" }
phon-schema = { path = "rust/phon-schema", version = "0.2.0-rc.5" }
taxon = { git = "https://github.com/bearcove/weavy", rev = "ca49bde0aa8e105da661edf6dd09f7013fe86aaf" }
weavy = { git = "https://github.com/bearcove/weavy", rev = "ca49bde0aa8e105da661edf6dd09f7013fe86aaf" }
proptest = "1"
tracing = { version = "0.1.43", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "std", "env-filter"] }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
