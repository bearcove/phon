<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="bearcove labs">
  <rect width="32" height="32" rx="7" fill="#080c0b"/>
  <g fill="#4fd6a8">
    <!-- legs -->
    <rect x="10.0" y="19.3" width="2.5" height="5.3" rx="1.1"/>
    <rect x="18.0" y="19.3" width="2.5" height="5.3" rx="1.1"/>
    <rect x="6.5" y="19.0" width="2.9" height="6.0" rx="1.3"/>
    <rect x="21.4" y="19.0" width="2.9" height="6.0" rx="1.3"/>
    <!-- torso -->
    <ellipse cx="17.5" cy="16.6" rx="8.1" ry="5.0"/>
    <!-- shoulder hump (front) -->
    <circle cx="12.6" cy="11.6" r="4.1"/>
    <!-- tail -->
    <circle cx="25.6" cy="15.6" r="1.2"/>
    <!-- head -->
    <circle cx="7.1" cy="15.1" r="3.7"/>
    <!-- ear -->
    <circle cx="7.6" cy="11.2" r="1.7"/>
    <!-- muzzle -->
    <ellipse cx="3.7" cy="16.1" rx="2.4" ry="1.65"/>
  </g>
  <g fill="#080c0b">
    <!-- eye -->
    <circle cx="6.6" cy="14.3" r="0.85"/>
    <!-- nose -->
    <circle cx="2.5" cy="15.9" r="0.8"/>
  </g>
</svg>
